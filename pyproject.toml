#Настройки проекта, такие как, мин. версия питона, зависимости, pytest, ruff, mypy
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-snake-game"
version = "1.0.0"
description = "A classic Snake game played in the terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
snake-game = "snake_game.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["snake_game"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S311"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["snake_game", "snake.py", "tests"]
